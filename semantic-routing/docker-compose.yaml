services:
  # --- GPU 0 Instance ---
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    # ports:
    #   - "11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ~/.cache:/root/.ollama
    networks:
      - llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]

  # --- GPU 1 Instance ---
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    # ports:
    #   - "11435:11434" # Binds internal 11434 to external 11435
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ./models:/root/.ollama
    networks:
      - llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '1' ]
              capabilities: [ gpu ]

  # --- LiteLLM Gateway Router ---
  litellm:
    image: litellm/litellm:main-stable
    container_name: litellm-gateway
    ports:
      - "${LITELLM_BIND:-}${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      # Force LiteLLM to use the mounted config file
      - LITELLM_CONFIG_FILE=/app/config.yaml
      # Enable debug logging to see config loading
      - LITELLM_LOG=debug
    networks:
      - llm-network
    restart: unless-stopped
    depends_on:
      - ollama-gpu0
      - ollama-gpu1

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
