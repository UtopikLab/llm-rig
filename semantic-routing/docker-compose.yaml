services:
  litellm:
    image: litellm/litellm:main-stable
    container_name: litellm-gateway
    ports:
      - "${LITELLM_BIND:-}${LITELLM_PORT:-4000}:4000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@db:5432/litellm
    env_file:
      - .env
    networks:
      - llm-network
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_USER: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U litellm" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
