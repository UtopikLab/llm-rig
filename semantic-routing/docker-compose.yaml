services:
  # --- GPU 0 Instance ---
  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    # ports:
    #   - "11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ~/.cache:/root/.ollama
    networks:
      - llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0' ]
              capabilities: [ gpu ]

  # --- GPU 1 Instance ---
  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    # ports:
    #   - "11435:11434" # Binds internal 11434 to external 11435
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ./models:/root/.ollama
    networks:
      - llm-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '1' ]
              capabilities: [ gpu ]

  # --- LiteLLM Gateway Router ---
  litellm:
    image: litellm/litellm:main-stable
    container_name: litellm-gateway
    ports:
      - "${LITELLM_BIND:-}${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
      - /etc/localtime:/etc/localtime:ro
    # environment:
    #   DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@db:5432/litellm
    #   STORE_MODEL_IN_DB: "True"
    env_file:
      - .env
    networks:
      - llm-network
    restart: unless-stopped
    depends_on:
      - ollama-gpu0
      - ollama-gpu1
      # - db

  # --- LiteLLM PostgreSQL Database ---
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: litellm
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
  #     POSTGRES_DB: litellm
  #   networks:
  #     - llm-network
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U litellm"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

networks:
  llm-network:
    driver: bridge

volumes:
  # ollama-data-gpu0:
  # ollama-data-gpu1:
  postgres_data:
