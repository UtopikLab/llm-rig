# ---------------------------------------------------------------------------
# Secrets referenced by the orchestrator stack (supervisor + coder agents).
# ---------------------------------------------------------------------------
#
# The always-on supervisor (orchestrator/supervisor.yaml) and the coder
# workers (orchestrator/workers.yaml) read `orchestrator-secrets` from the
# `orchestrator` namespace. That secret lives in `monitoring/secrets.yaml`
# for the orchestrator stack; the worker stack reuses the same secret name so
# the supervisor and workers share one key.
#
# Two keys:
#
#   openai-api-key   — OpenAI-compatible key for the coder workers' local
#                      llama.cpp inference (and the judge model over the
#                      network). Optional: this stack is fully local, so it
#                      is only required for external/OpenAI-API access. Filled
#                      below with a test-format placeholder; replace with a
#                      real key from your platform.openai.com account if you
#                      ever call an external endpoint.
#
#   github-token     — a workflow-scoped Personal Access Token (PAT) used by
#                      the supervisor's task-acceptor to authenticate the
#                      /api/v1/tasks/spawn endpoint (see
#                      orchestrator/supervisor-task-acceptor.py) and to act as
#                      author on the PRs the agents open. It must have enough
#                      scope to create PRs (write:repository).
#
# Create it with:
#
#   kubectl create secret generic orchestrator-secrets \
#     --namespace orchestrator \
#     --from-literal=openai-api-key=<the-openai-key> \
#     --from-literal=github-token=<the-pat>
#
# See monitoring/secrets.yaml for the idrac-credentials secret.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: orchestrator
  labels:
    app: orchestrator
type: Opaque
stringData:
  openai-api-key: sk-test-4721718cb00fbd3b6a770195e5160d08 # <-- OpenAI test-format key (swap for a real key from your account)
  github-token: ""
